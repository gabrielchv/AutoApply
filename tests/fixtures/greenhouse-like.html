<form>
  <div>
    <label for="first_name">First Name *</label>
    <input
      type="text"
      id="first_name"
      name="job_application[first_name]"
      required
      autocomplete="given-name"
    />
  </div>
  <div>
    <label for="email">Email *</label>
    <input type="email" id="email" name="job_application[email]" required />
  </div>
  <div>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" />
  </div>
  <div>
    <label for="resume">Resume/CV *</label>
    <input
      type="file"
      id="resume"
      name="job_application[resume]"
      style="display: none"
      required
    />
    <button type="button">Attach resume</button>
  </div>
  <div>
    <label for="cover_letter">Cover Letter</label>
    <textarea
      id="cover_letter"
      name="job_application[cover_letter]"
      placeholder="Why do you want to work here?"
    ></textarea>
  </div>
  <fieldset>
    <legend>Are you authorized to work in the US?</legend>
    <label><input type="radio" name="work_auth" value="yes" /> Yes</label>
    <label><input type="radio" name="work_auth" value="no" /> No</label>
  </fieldset>
  <div>
    <label for="source">How did you hear about us?</label>
    <select id="source" name="source">
      <option value="">Select...</option>
      <option value="linkedin">LinkedIn</option>
      <option value="referral">Referral</option>
    </select>
  </div>
  <input type="hidden" name="token" value="abc" />
  <input type="submit" value="Submit application" />
</form>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workday Test Co - Data Engineer</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JobPosting",
  "title": "Data Engineer",
  "description": "Build and maintain robust data pipelines in Python and SQL. Design schemas, automate ETL jobs, and ensure data quality across the platform.",
  "hiringOrganization": { "@type": "Organization", "name": "Workday Test Co" }
}
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #f2f6fc 0%, #e9eef7 100%);
    color: #1c2733;
    min-height: 100vh;
  }
  .card {
    max-width: 640px;
    margin: 48px auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(28, 39, 51, 0.12);
    overflow: hidden;
  }
  .header-bar {
    background: #1f4e79;
    color: #ffffff;
    padding: 20px 32px;
  }
  .header-bar h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .header-bar p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .body { padding: 28px 32px 32px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #34495e;
  }
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"],
  .field input[type="number"],
  .field input[type="date"],
  .field select {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    outline: none;
    background: #ffffff;
  }
  .field input:focus, .field select:focus { border-color: #1f4e79; box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.15); }
  .error { color: #c0392b; font-size: 12px; margin-top: 4px; display: none; }
  fieldset { border: 1px solid #d7dee8; border-radius: 8px; margin: 0 0 18px; padding: 14px 16px; }
  legend { font-size: 13px; font-weight: 600; color: #34495e; padding: 0 6px; }
  .radio-row { display: flex; gap: 24px; padding: 8px 4px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 400; margin: 0; color: #1c2733; }
  .uploader {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px dashed #9db2c7;
    border-radius: 6px;
    background: #f8fafc;
  }
  .uploader button {
    padding: 8px 14px;
    font-size: 13px;
    border: 1px solid #1f4e79;
    background: #1f4e79;
    color: #ffffff;
    border-radius: 6px;
    cursor: pointer;
  }
  .uploader .upload-status { font-size: 13px; color: #64748b; }
  .note { font-size: 12px; color: #7f8c9b; margin-top: 8px; }
  .submit-row { margin-top: 24px; }
  button[type="submit"] {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #27ae60;
    color: #ffffff;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: #229954; }
</style>
</head>
<body>
  <div class="card">
    <div class="header-bar">
      <h1>Data Engineer Application</h1>
      <p>Workday Test Co</p>
    </div>
    <div class="body">
      <form id="workday-form">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <span class="error" id="email-error">Invalid email</span>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
          <span class="error" id="phone-error">Invalid phone</span>
        </div>
        <div class="field">
          <label for="streetAddress">Street Address</label>
          <input type="text" id="streetAddress" name="streetAddress">
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" name="city">
        </div>
        <div class="field">
          <label for="region">Region / State</label>
          <input type="text" id="region" name="region">
        </div>
        <div class="field">
          <label for="postalCode">Postal Code</label>
          <input type="text" id="postalCode" name="postalCode">
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input type="text" id="country" name="country">
        </div>
        <fieldset>
          <legend>Are you authorized to work in the US?</legend>
          <div class="radio-row">
            <label><input type="radio" name="work_auth" value="yes"> Yes</label>
            <label><input type="radio" name="work_auth" value="no"> No</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="education">Highest level of education</label>
          <select id="education" name="education">
            <option value=""></option>
            <option value="high-school">High school</option>
            <option value="associate">Associate</option>
            <option value="bachelors">Bachelor's</option>
            <option value="masters">Master's</option>
            <option value="phd">PhD</option>
          </select>
        </div>
        <div class="field">
          <label for="yearsExperience">Years of experience</label>
          <input type="number" id="yearsExperience" name="yearsExperience" min="0">
        </div>
        <div class="field">
          <label for="startDate">Earliest start date</label>
          <input type="date" id="startDate" name="startDate">
        </div>
        <div class="field">
          <label>Resume</label>
          <input type="file" id="resume" name="resume" style="display:none">
          <div class="uploader">
            <button type="button" id="upload-trigger">Upload resume</button>
            <span class="upload-status" id="upload-status">No file attached</span>
          </div>
          <p class="note">This uploader simulates a widget that rejects automated file attachment (tests the extension's amber manual-attach highlight).</p>
        </div>
        <div class="submit-row">
          <button type="submit">Submit application</button>
        </div>
      </form>
    </div>
  </div>
<script>
(function () {
  var form = document.getElementById('workday-form');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
  });

  var uploadTrigger = document.getElementById('upload-trigger');
  uploadTrigger.addEventListener('click', function () {
    document.getElementById('resume').click();
  });

  var resumeInput = document.getElementById('resume');
  resumeInput.addEventListener('change', function () {
    this.value = '';
    document.getElementById('upload-status').textContent = 'Widget rejected the file';
  });

  var emailInput = document.getElementById('email');
  var emailError = document.getElementById('email-error');
  var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  emailInput.addEventListener('blur', function () {
    if (this.value.length > 0 && !emailRegex.test(this.value)) {
      emailError.style.display = 'inline';
    } else {
      emailError.style.display = 'none';
    }
  });

  var phoneInput = document.getElementById('phone');
  var phoneError = document.getElementById('phone-error');
  var phoneRegex = /^[0-9+\-\s()]+$/;
  phoneInput.addEventListener('blur', function () {
    if (this.value.length > 0 && !phoneRegex.test(this.value)) {
      phoneError.style.display = 'inline';
    } else {
      phoneError.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Manager - Lever Test Co</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JobPosting",
  "title": "Product Manager",
  "description": "We are looking for a Product Manager to own product strategy and the roadmap for our platform. You will drive cross-functional collaboration with engineering, design, and go-to-market teams to ship customer value.",
  "hiringOrganization": { "@type": "Organization", "name": "Lever Test Co" }
}
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f9;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  .card {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 32px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  .company {
    color: #666;
    margin: 0 0 24px;
    font-size: 14px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="url"],
  textarea,
  select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  textarea {
    min-height: 90px;
    resize: vertical;
  }
  fieldset {
    border: 1px solid #ccc;
    border-radius: 4px;
    margin: 0;
    padding: 12px;
  }
  legend {
    font-size: 14px;
    font-weight: 600;
    padding: 0 4px;
  }
  fieldset label {
    font-weight: 400;
    display: inline-block;
    margin: 0 16px 0 4px;
  }
  button[type="submit"] {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #2d7ff9;
    border-radius: 4px;
    background: #2d7ff9;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Product Manager</h1>
  <p class="company">Lever Test Co</p>
  <form id="lever-form">
    <div>
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" autocomplete="name">
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel">
    </div>
    <div>
      <label for="linkedin_url">LinkedIn URL</label>
      <input type="url" id="linkedin_url" name="linkedin_url">
    </div>
    <div>
      <label for="github_url">GitHub URL</label>
      <input type="url" id="github_url" name="github_url">
    </div>
    <div>
      <label for="portfolio_url">Portfolio URL</label>
      <input type="url" id="portfolio_url" name="portfolio_url">
    </div>
    <div>
      <label for="resume">Resume</label>
      <input type="file" id="resume" name="resume">
    </div>
    <div>
      <label for="how_heard">How did you hear about us?</label>
      <select id="how_heard" name="how_heard">
        <option value=""></option>
        <option value="linkedin">LinkedIn</option>
        <option value="referral">Referral</option>
        <option value="job-board">Job board</option>
        <option value="recruiter">Recruiter</option>
        <option value="other">Other</option>
      </select>
    </div>
    <fieldset>
      <legend>Are you authorized to work in the US?</legend>
      <label><input type="radio" name="work_auth" value="yes"> Yes</label>
      <label><input type="radio" name="work_auth" value="no"> No</label>
    </fieldset>
    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="woman"> Woman</label>
      <label><input type="radio" name="gender" value="man"> Man</label>
      <label><input type="radio" name="gender" value="nonbinary"> Non-binary</label>
      <label><input type="radio" name="gender" value="not-say"> Prefer not to say</label>
    </fieldset>
    <div>
      <label for="veteran_status">Veteran status</label>
      <select id="veteran_status" name="veteran_status">
        <option value=""></option>
        <option value="veteran">I am a veteran</option>
        <option value="not-veteran">I am not a veteran</option>
        <option value="prefer-not">Prefer not to say</option>
      </select>
    </div>
    <div>
      <label for="expected_salary">Expected salary</label>
      <input type="text" id="expected_salary" name="expected_salary" placeholder="e.g. $120k">
    </div>
    <div>
      <label for="interest_reason">Why are you interested in this role?</label>
      <textarea id="interest_reason" name="interest_reason"></textarea>
    </div>
    <div>
      <label for="cover_letter">Cover letter</label>
      <textarea id="cover_letter" name="cover_letter"></textarea>
    </div>
    <div>
      <button type="submit">Submit application</button>
    </div>
  </form>
</div>
<script>
  document.getElementById("lever-form").addEventListener("submit", function (event) {
    event.preventDefault();
  });
</script>
</body>
</html>

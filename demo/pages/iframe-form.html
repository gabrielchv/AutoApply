<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Form</title>
<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  background: #fff;
  color: #222;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px;
}
h1 {
  font-size: 1.3rem;
}
.card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 24px;
}
.field {
  margin-bottom: 16px;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 0.9rem;
}
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="file"],
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 0.95rem;
  font-family: inherit;
}
textarea {
  resize: vertical;
}
fieldset {
  border: none;
  margin: 0 0 16px;
  padding: 0;
}
legend {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 6px;
}
.radio-group label {
  display: inline-flex;
  align-items: center;
  font-weight: 400;
  margin-right: 16px;
}
.radio-group input {
  margin-right: 4px;
}
button {
  padding: 10px 18px;
  border: none;
  border-radius: 4px;
  background: #1a73e8;
  color: #fff;
  cursor: pointer;
  font-size: 0.95rem;
}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Application Form</h1>
<form id="job-form">
<div class="field">
<label for="full_name">Full Name</label>
<input type="text" id="full_name" name="full_name" required>
</div>
<div class="field">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
</div>
<div class="field">
<label for="phone">Phone</label>
<input type="tel" id="phone" name="phone">
</div>
<div class="field">
<label for="resume">Resume</label>
<input type="file" id="resume" name="resume">
</div>
<fieldset>
<legend>Are you authorized to work in the US?</legend>
<div class="radio-group">
<label for="work_auth_yes"><input type="radio" id="work_auth_yes" name="work_auth" value="yes"> Yes</label>
<label for="work_auth_no"><input type="radio" id="work_auth_no" name="work_auth" value="no"> No</label>
</div>
</fieldset>
<div class="field">
<label for="notes">Anything else we should know?</label>
<textarea id="notes" name="notes" rows="4"></textarea>
</div>
<button type="submit">Submit application</button>
</form>
</div>
</main>
<script>
document.getElementById('job-form').addEventListener('submit', function (event) {
  event.preventDefault();
});
</script>
</body>
</html>
